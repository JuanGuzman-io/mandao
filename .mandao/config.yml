# Mandao configuration. Run `mandao sync` after editing. Schema: docs/schemas.md
schema_version: 1
workspace: single
default_profile: app
language:
  business: en
  technical: en
roles:
  po: PE
  tech_lead: PE
  dev: PE
projects:
  - name: mandao
    path: .
    gates:
      format: npx biome format .
      lint: npm run lint
      typecheck: npm run typecheck
      test: npm test
      build: npm run build
      secrets: gitleaks git . --redact --no-banner
      audit: npm audit --omit=dev
      sast: semgrep scan --config p/typescript --config p/javascript --error --metrics=off
      metrics: npx biome lint --only=complexity/noExcessiveCognitiveComplexity --only=complexity/noExcessiveLinesPerFunction --only=style/noExcessiveLinesPerFile
harnesses:
  - claude
  - copilot
  - codex
# Feature branches from main, PRs to main (ADR 0023).
branching: { model: feature-branch, base: main }
