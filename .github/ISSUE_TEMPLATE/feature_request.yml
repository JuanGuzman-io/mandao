name: Feature request
description: Discuss a change before implementation.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and users affected
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change and expected outcome
      description: Include scope, examples and acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
