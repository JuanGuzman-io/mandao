name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal example, commands and sanitized logs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Mandao, Node, npm, OS and harness versions.
    validations:
      required: true
