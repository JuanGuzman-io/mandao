technologies:
  # Frontend
  react:
    match: { packages: [react] }
    primary: vercel-react-best-practices
  nextjs:
    match: { packages: [next], files: [next.config.js, next.config.mjs, next.config.ts] }
    primary: next-dev-loop
  angular:
    match: { packages: ["@angular/core"], files: [angular.json] }
    primary: angular-developer
  svelte:
    match: { packages: [svelte, "@sveltejs/kit"] }
    primary: svelte-core-bestpractices
  vue:
    match: { packages: [vue] }
    primary: vue-best-practices
  nuxt:
    match: { packages: [nuxt] }
    primary: nuxt
  tailwind:
    match: { packages: [tailwindcss] }
    primary: tailwind-design-system
  shadcn:
    match: { files: [components.json] }
    project_skill: Both shadcn skills had a Warn on skills.sh (2026-10-26).
  # Backend and data
  go:
    match: { files: [go.mod] }
    primary: golang-code-style
  python:
    match: { files: [pyproject.toml, requirements.txt] }
    primary: python-code-style
  fastapi:
    match: { packages: [fastapi] }
    primary: fastapi
  django:
    match: { packages: [django], files: [manage.py] }
    primary: django-perf-review
  fastify:
    match: { packages: [fastify] }
    primary: fastify-best-practices
  nestjs:
    match: { packages: ["@nestjs/core"] }
    project_skill: The known NestJS skill has no LICENSE file and one maintainer (2026-10-26).
  express:
    match: { packages: [express] }
    project_skill: No Express skill passed admission (2026-10-26).
  hono:
    match: { packages: [hono] }
    project_skill: Hono's official skill had a Warn on skills.sh (2026-10-26).
  postgres:
    match: { packages: [pg, postgres, "@supabase/supabase-js", "@neondatabase/serverless", psycopg, psycopg2, psycopg2-binary, asyncpg] }
    primary: supabase-postgres-best-practices
  prisma:
    match: { packages: [prisma, "@prisma/client"] }
    primary: prisma-client-api
  drizzle:
    match: { packages: [drizzle-orm] }
    project_skill: No Drizzle skill passed admission (2026-10-26).
  redis:
    match: { packages: [redis, ioredis] }
    primary: redis-core
  graphql:
    match: { packages: [graphql, "@apollo/server", "@apollo/client", graphql-yoga] }
    primary: graphql-schema
  # Mobile
  react-native:
    match: { packages: [react-native] }
    primary: vercel-react-native-skills
  expo:
    match: { packages: [expo] }
    primary: expo-overview
  flutter:
    match: { files: [pubspec.yaml] }
    primary: flutter-apply-architecture-best-practices
  # Cross-cutting
  playwright:
    match: { packages: ["@playwright/test", playwright] }
    primary: playwright-best-practices
  github-actions:
    match: { files: [.github/workflows] }
    primary: github-actions-hardening

packs:
  core: [graphify, systematic-debugging]
  po: [brainstorming, product-manager-toolkit]
  dev-node: [typescript-advanced-types, api-design-principles, error-handling-patterns]
  dev-web: [vercel-react-best-practices, next-dev-loop, tailwind-design-system]
  dev-go: [golang-code-style, golang-error-handling, golang-testing]
