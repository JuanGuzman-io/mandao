# Mandao curated skills catalog. Schema: docs/schemas.md.
#
# Admission (design doc §17.2): maintained, clear license, matches the framework version, tried on a
# real project. Third-party skills are referenced, never vendored.
#
# Bootstrap entries were verified at their upstream source (2026-10-20). The stack, cross-cutting, `ai` and
# security entries come from docs/audits/2026-10-skills-for-app.md (phase 20): repository, path, frontmatter
# name, license and the commit each tag resolves to were re-read through the GitHub API on 2026-10-27, and
# none had a Warn or Fail on skills.sh (Gen Agent Trust Hub, Socket, Snyk) on the `audit.checked` date. They
# stay `vetted: false` until tried on a real project (§17.2). When a pin moves, re-check its audit by hand and
# update `audit.checked`. `license_from: frontmatter`: the repository has no LICENSE file. No entry may carry an
# UNVERIFIED placeholder: `skills add` refuses it and `run fingerprint` never proposes it.
schema_version: 1

bootstrap: [graphify, software-architect, product-manager-toolkit, brainstorming, mandao-skills]

skills:
  # Bootstrap skills: metadata verified at the upstream source on 2026-10-20.
  graphify:
    description: Repository mapping into a persistent graph; mandatory in legacy constitution mode when available. Installs its own agent and git hooks.
    source:
      type: command
      repo: https://github.com/Graphify-Labs/graphify
      install: ["uv tool install graphifyy==0.9.92", "graphify install --project"]
      version_command: graphify --version
    version: 0.9.92
    author: Safi Shamsi and the Graphify contributors
    license: Apache-2.0
    trust: vendor
    vetted: true
    binding: core
    phases: [constitution, story, specify, implement, close]
    fallback: The commands map the repository with their own reads and searches, without the graph.
  software-architect:
    description: TRD, NFRs as testable scenarios, architecture styles, patterns and ADRs.
    # Upstream has no per-skill installer (`npx akili-specs install` installs the whole AKILI kit).
    source: { type: git, url: https://github.com/JuankCadavid/akili-specs, ref: v2.34.1, path: .claude/skills/software-architect, commit: b04e03f555ec26b0221b0675a3225a9d0da3200d }
    version: 2.34.1
    author: Juan Carlos Cadavid
    license: MIT
    trust: community
    vetted: true
    binding: core
    phases: [constitution, specify]
    fallback: The commands write the TRD, NFRs and ADRs from their own templates, without the skill's patterns.
  product-manager-toolkit:
    description: Derive the product layer from code; capability maps, PRDs and prioritization.
    source: { type: git, url: https://github.com/alirezarezvani/claude-skills, ref: v2.12.0, path: product-team/skills/product-manager-toolkit, commit: 437f321c8cadf9f68ba0d8440ef02dc21ebb3d72 }
    version: 2.12.0
    author: Alireza Rezvani
    license: MIT
    trust: community
    vetted: true
    binding: core
    phases: [constitution, story, specify]
    fallback: The commands derive the product layer from the code and the tracker with their own steps.
  brainstorming:
    description: Elicit intent and requirements when there is no code yet (constitution new mode).
    source: { type: git, url: https://github.com/obra/superpowers, ref: v7.0.0, path: skills/brainstorming, commit: bb92a77741419a4ab5f06e711a283343f1ada0c3 }
    version: 7.0.0
    author: Jesse Vincent
    license: MIT
    trust: community
    vetted: true
    binding: core
    phases: [constitution, story, specify]
    fallback: The commands elicit intent with their own questions, one at a time, and continue with their own steps.
  mandao-skills:
    description: Mandao's own skill that resolves which project skills to bring after the constitution. Planned for the next iteration.
    source: { type: bundled, path: skills/mandao-skills }
    version: 0.1.0
    author: Mandao
    license: MIT
    vetted: false
    binding: core
    phases: [constitution]
  # Mock-only: `install_on: mock-accepted` means init, sync and matching never install it; only
  # `node .mandao/bin/mandao.mjs skills add <id> --yes` after an accepted mock (rules/mockups.md). Vetted false:
  # license, pin and contents were checked at the source on 2026-10-22, but admission (design doc 17.2) also
  # asks for a real-project trial, which has not happened. Upstream auto-triggers on any web UI, so
  # `model_invocation: false` disables automatic invocation on copy (ADR 0056). Leonxlnx/taste-skill is not here.
  ai-design-skills:
    description: Landing-page and web UI design guidance for visual mocks; used only after the user accepts a mock.
    source: { type: git, url: https://github.com/elayadesign/ai-design-skills, ref: 1c1e97cb9878e236552c772092dda7adcdddbcb2, path: skills/landing-page-design, commit: 1c1e97cb9878e236552c772092dda7adcdddbcb2 }
    version: 1c1e97c
    author: Elaya
    license: MIT
    trust: community
    vetted: false
    binding: conditional
    phases: [story, specify, implement]
    profiles: [app]
    fallback: The mock is built from ux.md, the project styles and the story, without the skill's guidance.
    install_on: mock-accepted
    model_invocation: false
