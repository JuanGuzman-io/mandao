# Mandao's model recommendations per harness and role.
#
# Defaults must be available on every plan of the harness; models that depend on the plan or on an
# administrator go under `optional` with a note, never as defaults. Taken from each harness's official
# documentation on the `reviewed` date, never from memory. `mandao update` refreshes this file with the
# package; it never changes the choices in .mandao/models.yml and only offers the new recommendation.
schema_version: 1

harnesses:
  claude:
    reviewed: 2026-10-20
    sources:
      - https://code.claude.com/docs/en/model-config
    # Aliases resolve to the latest model of each family per provider. Opus is the default model on
    # Pro, Max, Team, Enterprise and the API, so opus, sonnet and haiku are available on every plan.
    available: [opus, sonnet, haiku]
    routed:
      leader: opus
      reviewer: opus
      # Reviews when the Implementer ran on the Reviewer's model (a task escalated to strong).
      reviewer_alt: sonnet
      implementer: { fast: haiku, standard: sonnet, strong: opus }
      tester: sonnet
    simple:
      implementer: sonnet
      reviewer: opus
    optional:
      - model: fable
        roles: [leader, reviewer, reviewer_alt]
        note: requires availability on your plan (Fable is never a plan default and can bill to usage credits)

  copilot:
    reviewed: 2026-10-20
    sources:
      - https://docs.github.com/en/copilot/reference/ai-models/supported-models
      - https://code.visualstudio.com/docs/agents/reference/custom-agent-file-reference
    # Included on Pro, Pro+, Max, Business and Enterprise and supported in VS Code. Copilot Free and
    # Student only get auto model selection, so they ignore the model field of agents and prompts.
    available:
      - Claude Sonnet 5.5
      - Claude Sonnet 5
      - Claude Haiku 5.5
      - Claude Haiku 4.5
      - GPT-6 Luna
      - GPT-5.6 Terra
      - GPT-5.6 Luna
      - GPT-5.3-Codex
      - Gemini 3.8 Flash
    routed:
      leader: Claude Sonnet 5.5
      # A different vendor from the Implementer keeps the review independent.
      reviewer: GPT-6 Luna
      reviewer_alt: Claude Sonnet 5.5
      implementer: { fast: Claude Haiku 5.5, standard: Claude Sonnet 5.5, strong: Claude Sonnet 5.5 }
      tester: Claude Sonnet 5.5
    simple:
      implementer: Claude Sonnet 5.5
      reviewer: GPT-6 Luna
    optional:
      - model: Claude Opus 5.5
        roles: [leader, reviewer, reviewer_alt, implementer]
        note: requires availability on your plan (not included in Copilot Pro)
      - model: GPT-6 Sol
        roles: [reviewer, reviewer_alt]
        note: requires availability on your plan (not included in Copilot Pro)
      - model: GPT-6.1 Sol
        roles: [reviewer, reviewer_alt]
        note: requires availability on your plan (not included in Copilot Pro; VS Code support not listed)
      - model: Claude Fable 5.1
        roles: [leader, reviewer, reviewer_alt]
        note: requires availability on your plan (an administrator must enable it)
